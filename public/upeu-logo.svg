<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e5984;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f4a900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc947;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="60" cy="60" r="58" fill="url(#blueGradient)" stroke="#0f1e2d" stroke-width="2"/>
  
  <!-- Letra A estilizada -->
  <path d="M30 85 L45 45 L75 45 L90 85 L80 85 L76 75 L44 75 L40 85 Z" fill="url(#goldGradient)"/>
  
  <!-- Líneas curvas en la A -->
  <path d="M35 65 Q45 55 55 65" stroke="#1e3a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M55 65 Q65 55 75 65" stroke="#1e3a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M75 65 Q85 55 95 65" stroke="#1e3a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Texto UPeU -->
  <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f4a900">UPeU</text>
  
  <!-- Elementos decorativos -->
  <circle cx="25" cy="25" r="3" fill="#f4a900" opacity="0.6"/>
